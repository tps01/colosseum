[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-core"
version = "0.16.2"
description = "Colosseum test automation framework (core runtime)"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "tomli>=2.0,<3; python_version < '3.11'",
  "typing_extensions>=4.0,<5; python_version < '3.10'",
  "customtkinter>=5.2,<6",
  "PyYAML>=6.0,<7",
  "types-PyYAML>=6.0,<7",
  "pytest>=8.0,<9",
  "sphinx>=7.0,<9",
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["."]
markers = [
    "requirement(id): traceability to test-plan requirement ID",
    "gui: requires display and tkinter",
]

[project.scripts]
colosseum = "colosseum.runner.cli:main"

[tool.setuptools.packages.find]
include = ["colosseum", "colosseum.*"]

[tool.setuptools.package-data]
colosseum = ["py.typed"]
"colosseum.gui" = ["assets/*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum", "scripts"]

[tool.ruff.lint]
select = ["A", "BLE", "FBT", "N", "COM", "C4", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"colosseum/logging/__init__.py" = ["A005"]
"colosseum/gui/app.py" = ["E501", "FBT003", "ANN401"]
"colosseum/gui/_icon.py" = ["FBT003"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "customtkinter.*",
  "tkinter.*",
  "sphinx.*",
  "pytest",
  "tomli",
  "tomllib",
  "yaml",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
