[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# TODO: Rename distribution (e.g. acme-bench) when forking this template.
name = "colosseum-template"
version = "0.1.0"
# TODO: Replace with your extension description.
description = "Colosseum extension template (copy and customize)"
requires-python = ">=3.9"
# TODO: Pin a compatible colosseum version range for production releases.
dependencies = ["colosseum-core>=0.15,<0.17"]

[project.entry-points."colosseum.plugins"]
# TODO: Replace entry-point key and target module after rename (e.g. acme = "acme_bench:register").
template = "colosseum_template:register"

[tool.setuptools.packages.find]
# TODO: Update glob to match your Python package directory name.
include = ["colosseum_template*"]
