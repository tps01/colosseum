name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -e .
      - run: python scripts/run_tests.py --durations=15

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -e .
      - run: python scripts/run_static.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -e .
      - run: python scripts/docgen/build_all.py --skip-pdf

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip setuptools wheel build
      - run: python -m build
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/colosseum-core-wheel
          /tmp/colosseum-core-wheel/bin/pip install dist/*.whl
          /tmp/colosseum-core-wheel/bin/python -c "import colosseum; print(colosseum.__version__)"
          /tmp/colosseum-core-wheel/bin/colosseum --help
