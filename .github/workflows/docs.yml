name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e .
      - name: Build Sphinx site (HTML only)
        run: python scripts/docgen/build_all.py --skip-pdf
      - name: Record version
        run: python -c "import colosseum; print(colosseum.__version__)" > build/docgen/site/html/version.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docgen/site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
